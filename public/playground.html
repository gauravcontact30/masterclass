<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; form-action 'none'; base-uri 'none'"></head><body><script>
let worker, timer;
function stop(){if(worker)worker.terminate();clearTimeout(timer);}
addEventListener('message',event=>{
 if(event.source!==parent)return;
 if(event.data?.type==='stop'){stop();return;}
 if(event.data?.type!=='run')return;
 stop();
 const {code,input}=event.data;
 if(typeof code!=='string'||code.length>10000||typeof input!=='string'||input.length>2000)return;
 const source=`onmessage=async e=>{let lines=[];const log=(...args)=>{if(lines.length<80)lines.push(args.map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' ').slice(0,1000));};try{const input=JSON.parse(e.data.input);await (new Function('input','console',e.data.code))(input,{log,error:log,warn:log});postMessage(lines.join('\\n').slice(0,12000));}catch(error){postMessage(String(error).slice(0,2000));}}`;
 const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);
 worker.onmessage=e=>{parent.postMessage({type:'result',output:String(e.data).slice(0,12000)},'*');stop();};
 worker.onerror=()=>{parent.postMessage({type:'result',output:'Execution failed.'},'*');stop();};
 timer=setTimeout(()=>{stop();parent.postMessage({type:'result',output:'Time limit exceeded (2 seconds).'},'*');},2000);
 worker.postMessage({code,input});
});
</script></body></html>
